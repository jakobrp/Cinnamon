anonymization:
  algorithm:
    id: "anonymization_tabular"
    version: "1.0"
  privacyModels:
  - name: "anonymization_tabular"
    type: "tabular"
    version: "1.0"
    modelConfiguration:
      riskThresholdType: "Max"
      riskThresholdValue: 0.1
      generalizationSetting: "Global"
      suppressionLimit: 0
  attributeConfiguration: []
synthetization_configuration:
  algorithm:
    id: "dpgan"
    version: "0.1"
    synthesizer: dpgan
    model_parameter:
      number_of_layers: 2
      number_of_units_in_layers: 256
    model_fitting:
      batch_size: 256
      epochs: 50
      epsilon: 5
      delta: 1.0E-5
    sampling:
      num_samples: 70000
    type: "cross-sectional"
evaluation_configuration:
  algorithm:
    id: "evaluation"
    version: "0.1"
  data_format: "cross-sectional"
  resemblance:
    mean: {}
    standard_deviation: {}
    variance: {}
    distinct_values: {}
    mode: {}
    fifth_percentile: {}
    median: {}
    q1: {}
    q3: {}
