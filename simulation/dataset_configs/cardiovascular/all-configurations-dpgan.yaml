    maximum: {}
    density: {}
    histogram: {}
    kolmogorov_smirnov: {}
    hellinger_distance: {}
    frequency_plot: {}
    calculate_columnwise_correlations: {}
    calculate_columnwise_correlations_distance: {}
    missing_values_count: {}
    visualize_columnwise_correlations: {}
  utility:
    machine_learning:
      train_size: 0.8
      target_variable: "cardio"
risk_assessment_configuration:
  algorithm:
    id: "risk_assessment"
    version: "0.1"
  attribute_inference:
    n_attacks: 100
  data_format: "cross-sectional"
  singlingout_multi:
    n_attacks: 100
  n_outlier_targets: 1
  columns_excluded: []
  linkage:
    n_attacks: 100
    available_columns:
    - "ap_hi"
    - "ap_lo"
    - "cholesterol"
    - "gluc"
    - "active"
    - "alco"
    unavailable_columns:
    - "age"
    - "gender"
    - "height"
    - "weight"
    - "smoke"
    - "cardio"
  n_iterations: 1
  metrics:
    uniqueness: true
  targets: []
  singlingout_uni:
