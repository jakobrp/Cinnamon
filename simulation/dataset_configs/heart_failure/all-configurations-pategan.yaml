    missing_values_count: {}
    visualize_columnwise_correlations: {}
  utility:
    machine_learning:
      train_size: 0.8
      target_variable: "HeartDisease"
risk_assessment_configuration:
  algorithm:
    id: "risk_assessment"
    version: "0.1"
  attribute_inference:
    n_attacks: 100
  data_format: "cross-sectional"
  singlingout_multi:
    n_attacks: 100
  n_outlier_targets: 5
  columns_excluded: []
  linkage:
    n_attacks: 100
    available_columns:
