project:
  projectName: "dpgan_heart_config"
  contactMail: null
  contactUrl: null
  reportCreator: null
  metricConfiguration: null
dataSource:
  dataSourceType: "LOCAL"
  fileType: "CSV"
  csvFileConfiguration:
    columnSeparator: ","
    lineSeparator: "\n"
    quoteChar: "\""
    hasHeader: true
dataset:
  createHoldOutSplit: true
  holdOutSplitPercentage: 0.2
pipeline:
  pipelines:
  - jobs:
    - name: "anonymization"
      enabled: false
      configuration: 0
    - name: "synthetization"
      enabled: true
      configuration: 0
    - name: "technical_evaluation"
      enabled: true
      configuration: 0
    - name: "risk_evaluation"
      enabled: true
      configuration: 0
    - name: "risk_evaluation_o"
      enabled: true
      configuration: 0
configurations:
- index: 0
  name: "Age"
  type: "INTEGER"
  scale: "INTERVAL"
  configurations: []
- index: 1
  name: "Sex"
  type: "STRING"
  scale: "NOMINAL"
  configurations: []
- index: 2
  name: "ChestPainType"
  type: "STRING"
  scale: "NOMINAL"
  configurations: []
- index: 3
  name: "RestingBP"
  type: "INTEGER"
  scale: "INTERVAL"
  configurations: []
- index: 4
  name: "Cholesterol"
  type: "INTEGER"
  scale: "INTERVAL"
  configurations: []
- index: 5
  name: "FastingBS"
  type: "INTEGER"
  scale: "INTERVAL"
  configurations: []
- index: 6
  name: "RestingECG"
  type: "STRING"
  scale: "NOMINAL"
  configurations: []
- index: 7
  name: "MaxHR"
  type: "INTEGER"
  scale: "INTERVAL"
  configurations: []
- index: 8
  name: "ExerciseAngina"
  type: "STRING"
  scale: "NOMINAL"
  configurations: []
- index: 9
  name: "Oldpeak"
  type: "DECIMAL"
  scale: "RATIO"
  configurations: []
- index: 10
  name: "ST_Slope"
  type: "STRING"
  scale: "NOMINAL"
  configurations: []
- index: 11
  name: "HeartDisease"
  type: "INTEGER"
  scale: "INTERVAL"
  configurations: []
anonymization:
  algorithm:
    id: "anonymization_tabular"
    version: "1.0"
  privacyModels:
  - name: "anonymization_tabular"
    type: "tabular"
    version: "1.0"
    modelConfiguration:
      riskThresholdType: "Max"
      riskThresholdValue: 0.1
      generalizationSetting: "Global"
      suppressionLimit: 0
  attributeConfiguration: []
synthetization_configuration:
  algorithm:
    id: "dpgan"
    version: "0.1"
    synthesizer: "dpgan"
    model_parameter:
      number_of_layers: 2
      number_of_units_in_layers: 256
    model_fitting:
      batch_size: 128
      epochs: 5
      epsilon: 1
      delta: 1.0E-5
    sampling:
      num_samples: 918
    type: "cross-sectional"
evaluation_configuration:
  algorithm:
    id: "evaluation"
    version: "0.1"
  data_format: "cross-sectional"
  resemblance:
    mean: {}
    standard_deviation: {}
    variance: {}
    distinct_values: {}
    mode: {}
    fifth_percentile: {}
    median: {}
    q1: {}
    q3: {}
    ninety_fifth_percentile: {}
    minimum: {}
    maximum: {}
    density: {}
    histogram: {}
    kolmogorov_smirnov: {}
    hellinger_distance: {}
    frequency_plot: {}
    calculate_columnwise_correlations: {}
    calculate_columnwise_correlations_distance: {}
    missing_values_count: {}
    visualize_columnwise_correlations: {}
  utility:
    machine_learning:
      train_size: 0.8
      target_variable: "HeartDisease"
risk_assessment_configuration:
  algorithm:
    id: "risk_assessment"
    version: "0.1"
  attribute_inference:
    n_attacks: 100
  data_format: "cross-sectional"
  singlingout_multi:
    n_attacks: 100
  n_outlier_targets: 5
  columns_excluded: []
  linkage:
    n_attacks: 100
    available_columns:
    - "ChestPainType"
    - "RestingBP"
    - "Cholesterol"
    - "RestingECG"
    - "MaxHR"
    - "ExerciseAngina"
    - "Oldpeak"
    - "ST_Slope"
    unavailable_columns:
    - "Age"
    - "Sex"
    - "FastingBS"
    - "HeartDisease"
  n_iterations: 1
  metrics:
    uniqueness: true
  targets: []
  singlingout_uni:
    n_attacks: 100
  train_fraction: 0.8
  n_random_targets: 5
