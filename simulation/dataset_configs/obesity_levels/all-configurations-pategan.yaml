anonymization:
  algorithm:
    id: "anonymization_tabular"
    version: "1.0"
  privacyModels:
  - name: "anonymization_tabular"
    type: "tabular"
    version: "1.0"
    modelConfiguration:
      riskThresholdType: "Max"
      riskThresholdValue: 0.1
      generalizationSetting: "Global"
      suppressionLimit: 0
  attributeConfiguration: []
synthetization_configuration:
  algorithm:
    id: "pategan"
    version: "0.1"
    synthesizer: pategan
    model_parameter:
      number_of_layers: 2
      number_of_units_in_layers: 256
    model_fitting:
      batch_size: 64
      epochs: 200
      epsilon: 0.1
      delta: 1.0E-5
      n_teachers: 10
      lamda: 0.001
      alpha: 100
    sampling:
      num_samples: 2111
    type: "cross-sectional"
evaluation_configuration:
