anonymization:
  algorithm:
    id: "anonymization_tabular"
    version: "1.0"
  privacyModels:
  - name: "anonymization_tabular"
    type: "tabular"
    version: "1.0"
    modelConfiguration:
      riskThresholdType: "Max"
      riskThresholdValue: 0.1
      generalizationSetting: "Global"
      suppressionLimit: 0
  attributeConfiguration: []
synthetization_configuration:
  algorithm:
    id: "dpgan"
    version: "0.1"
    synthesizer: dpgan
    model_parameter:
      number_of_layers: 2
      number_of_units_in_layers: 256
    model_fitting:
      batch_size: 32
      epochs: 520
      epsilon: 1
      delta: 1.0E-5
    sampling:
      num_samples: 768
    type: "cross-sectional"
evaluation_configuration:
  algorithm:
    id: "evaluation"
    version: "0.1"
  data_format: "cross-sectional"
  resemblance:
    mean: {}
    standard_deviation: {}
    variance: {}
    distinct_values: {}
    mode: {}
    fifth_percentile: {}
    median: {}
    q1: {}
    q3: {}
    ninety_fifth_percentile: {}
    minimum: {}
    maximum: {}
    density: {}
    histogram: {}
    kolmogorov_smirnov: {}
    hellinger_distance: {}
    frequency_plot: {}
    calculate_columnwise_correlations: {}
    calculate_columnwise_correlations_distance: {}
    missing_values_count: {}
    visualize_columnwise_correlations: {}
  utility:
    machine_learning:
      train_size: 0.8
      target_variable: "Outcome"
risk_assessment_configuration:
  algorithm:
    id: "risk_assessment"
    version: "0.1"
  attribute_inference:
    n_attacks: 100
  data_format: "cross-sectional"
  singlingout_multi:
    n_attacks: 100
  n_outlier_targets: 5
  columns_excluded: []
  linkage:
    n_attacks: 100
    available_columns:
    - "Glucose"
    - "BloodPressure"
    - "SkinThickness"
    - "DiabetesPedigreeFunction"
    - "Insulin"
    unavailable_columns:
    - "Pregnancies"
    - "BMI"
    - "Age"
    - "Outcome"
  n_iterations: 1
  metrics:
    uniqueness: true
  targets: []
  singlingout_uni:
    n_attacks: 100
  train_fraction: 0.8
  n_random_targets: 5
